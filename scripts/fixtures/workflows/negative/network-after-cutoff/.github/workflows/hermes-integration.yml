# Hermes integration probe workflow (slice-00-05, new file only).
# SPIKE-EXPERIMENTAL marker:
# DISPOSITION: DELETE_UNLESS_ADOPTED_BY_00-07
#
# Runs the Slice 00-05 Hermes probe suite and the complete canonical
# offline check set on the required Windows and Linux runners. The job
# checks out the event-derived Candidate SHA up front (github.sha for
# push, pull_request.head.sha for pull_request), derives
# HERMES_PIPELINE_CANDIDATE_SHA in a later step, provisions the pinned
# Hermes release (v2026.8.3 = commit
# 3c27eb6234bf91b8ceee9e9071591b31e9b148cb) with Hermes' own uv.lock into
# an independent environment, builds a local install fixture whose main is
# pinned to the Candidate SHA (clone --no-checkout, checkout -B main), and
# completes the first frozen runtime-env materialization during dependency
# bootstrap. Everything below the network-cutoff boundary comment marker
# runs offline through the state-root interpreter; every child uses a
# fixture-built allow-list environment and excludes the unknown-secret
# canary. The job is read-only, persists no checkout credential, and
# consumes no GitHub secret.
name: hermes-integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hermes-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12.13"
      - name: Bootstrap frozen environment
        run: uv sync --frozen --all-groups
      - name: Derive candidate SHA and verify checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            candidate="${{ github.event.pull_request.head.sha }}"
          else
            candidate="${{ github.sha }}"
          fi
          echo "HERMES_PIPELINE_CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$candidate"
      - name: Provision pinned Hermes release into independent environment
        shell: bash
        run: |
          set -euo pipefail
          HERMES_DIR="$RUNNER_TEMP/hermes-agent"
          git clone --depth 1 https://github.com/NousResearch/hermes-agent "$HERMES_DIR"
          git -C "$HERMES_DIR" checkout 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          uv sync --frozen --python 3.11 --project "$HERMES_DIR"
          if [ -f "$HERMES_DIR/venv/Scripts/python.exe" ]; then
            echo "HERMES_PIPELINE_PROBE_HERMES=$HERMES_DIR/venv/Scripts/python.exe" >> "$GITHUB_ENV"
          elif [ -f "$HERMES_DIR/.venv/Scripts/python.exe" ]; then
            echo "HERMES_PIPELINE_PROBE_HERMES=$HERMES_DIR/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          elif [ -f "$HERMES_DIR/venv/bin/python" ]; then
            echo "HERMES_PIPELINE_PROBE_HERMES=$HERMES_DIR/venv/bin/python" >> "$GITHUB_ENV"
          elif [ -f "$HERMES_DIR/.venv/bin/python" ]; then
            echo "HERMES_PIPELINE_PROBE_HERMES=$HERMES_DIR/.venv/bin/python" >> "$GITHUB_ENV"
          else
            echo "Hermes interpreter not found" >&2
            exit 1
          fi
      - name: Build candidate-pinned install fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/candidate-fixture"
          git clone --no-checkout "file://$GITHUB_WORKSPACE" "$fixture"
          git -C "$fixture" checkout -B main "$HERMES_PIPELINE_CANDIDATE_SHA"
          test "$(git -C "$fixture" rev-parse HEAD)" = "$HERMES_PIPELINE_CANDIDATE_SHA"
          test "$(git -C "$fixture" rev-parse HEAD^{tree})" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})"
          echo "HERMES_PIPELINE_INSTALL_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - name: First frozen runtime materialization (dependency bootstrap)
        run: uv run --offline pytest tests/spike/runtime/test_runtime_provision.py::test_provisions_fresh_state_root
      # NETWORK-CUTOFF: every step below runs offline with the fixture-built
      # allow-list child environments and the unknown-secret canary absent.
      - name: Fetch over the network after cutoff
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://example.invalid/payload
      - name: Offline runtime re-materialization
        run: uv run --offline pytest tests/spike/runtime/test_runtime_provision.py::test_reprovisions_fresh_state_root_offline
      - name: Managed runtime self-check
        run: uv run --offline pytest tests/spike/runtime/test_runtime_provision.py::test_runs_selfcheck_in_managed_environment
      - name: Source-install probe
        run: uv run --offline pytest tests/spike/probe/install
      - name: PluginManager probe
        run: uv run --offline pytest tests/spike/probe/pluginmanager
      - name: Gateway interception probe
        run: uv run --offline pytest tests/spike/probe/gateway
      - name: Format check
        run: uv run --offline ruff format --check .
      - name: Lint check
        run: uv run --offline ruff check .
      - name: Type check
        run: uv run --offline pyright
      - name: Unit tests
        run: uv run --offline pytest
      - name: Contract check
        run: uv run --offline python -m hermes_pipeline.cli contracts check
      - name: Contract drift check
        run: uv run --offline python -m hermes_pipeline.cli contracts drift-check
      - name: Architecture check
        run: uv run --offline python -m hermes_pipeline.cli architecture check
      - name: Documentation checks
        run: uv run --offline python scripts/check_documentation.py
      - name: Documentation negative fixtures
        run: uv run --offline python scripts/check_documentation.py --self-test-negative
      - name: Schema negative fixtures
        run: uv run --offline python scripts/check_schemas.py --self-test-negative
      - name: Workflow policy
        run: uv run --offline python scripts/check_documentation.py --check-workflows
      - name: Hermes workflow policy
        run: uv run --offline python scripts/check_documentation.py --check-hermes-workflow
      - name: Hermes workflow negative fixtures
        run: uv run --offline python scripts/check_documentation.py --check-hermes-workflow-negative
      - name: Offline frozen sync
        run: uv sync --frozen --all-groups --offline
      - name: Offline version smoke
        run: uv run --offline python -m hermes_pipeline.cli --version
      - name: Repository artifact audit
        run: uv run --offline python scripts/check_repository_artifacts.py
