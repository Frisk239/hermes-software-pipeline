# Positive workflow fixture: valid subset YAML covering both OS, every
# required offline command, read-only permissions, and no persisted
# checkout credentials.
name: fixture-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run documentation checks
        run: python scripts/check_documentation.py
      - name: Run schema contract checks
        run: python scripts/check_schemas.py
      - name: Run schema negative fixture checks
        run: python scripts/check_schemas.py --self-test-negative
      - name: Verify workflow configuration
        run: python scripts/check_documentation.py --check-workflow
